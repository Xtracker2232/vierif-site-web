<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vérification - Léon Chiris, Amiral de Grasse, Decroisset</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #2c2f33; color: #fff;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 20px;
    }
    .boite {
      background: #23272a; padding: 2rem; border-radius: 12px;
      max-width: 500px; width: 100%; text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    h1 { color: #5865F2; margin-top: 0; font-size: 1.5rem; }
    .lycees { font-size: .85rem; color: #b9bbbe; margin-bottom: 1.5rem; line-height: 1.6; }
    input[type=text] {
      width: 100%; padding: 14px; font-size: 22px; text-align: center;
      letter-spacing: 6px; text-transform: uppercase; border-radius: 6px;
      border: 2px solid #40444b; background: #2c2f33; color: #fff;
      margin: 16px 0; outline: none;
    }
    input[type=text]:focus { border-color: #5865F2; }
    button {
      background: #5865F2; color: #fff; border: none; padding: 12px 32px;
      font-size: 16px; border-radius: 6px; cursor: pointer;
      transition: background .15s;
    }
    button:hover:not(:disabled) { background: #4752c4; }
    button:disabled { background: #555; cursor: not-allowed; opacity: .6; }
    .message { margin-top: 16px; font-weight: 600; line-height: 1.5; min-height: 24px; }
    .ok { color: #57F287; }
    .erreur { color: #ED4245; }
    .info { color: #FEE75C; }
    .etape { display: none; }
    .etape.active { display: block; animation: fadeIn .3s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    input[type=file] {
      margin: 16px 0; color: #fff; font-size: 14px;
      width: 100%; padding: 12px; background: #2c2f33;
      border: 2px dashed #40444b; border-radius: 6px; cursor: pointer;
    }
    input[type=file]:hover { border-color: #5865F2; }
    #apercu {
      max-width: 100%; max-height: 300px; margin-top: 12px;
      border-radius: 8px; display: none;
    }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .etapes-indic { display: flex; justify-content: center; gap: 8px; margin-bottom: 1.5rem; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #40444b; }
    .dot.active { background: #5865F2; }
  </style>
</head>
<body>
  <div class="boite">
    <div class="etapes-indic">
      <div class="dot active" id="dot1"></div>
      <div class="dot" id="dot2"></div>
    </div>

    <h1>🔒 Vérification</h1>
    <p class="lycees">
      Réservé aux élèves de :<br>
      <strong>Léon Chiris</strong> · <strong>Amiral de Grasse</strong> · <strong>Decroisset</strong>
    </p>

    <div id="etape1" class="etape active">
      <p>Entre le code reçu en MP sur Discord :</p>
      <input type="text" id="code" maxlength="6" placeholder="A7K3P9" autocomplete="off">
      <button onclick="verifierCode()" id="btnCode">Valider le code</button>
      <p id="message1" class="message"></p>
    </div>

    <div id="etape2" class="etape">
      <p>📸 Prends une photo de ton <strong>carnet de correspondance</strong>.<br>
      Le nom du lycée doit être visible.</p>
      <input type="file" id="photo" accept="image/*" capture="environment">
      <img id="apercu" alt="Aperçu du carnet">
      <br>
      <button id="btnEnvoi" onclick="envoyerPhoto()" disabled>Envoyer la photo</button>
      <p id="message2" class="message"></p>
    </div>
  </div>

  <script>
    let codeActuel = '';

    async function verifierCode() {
      const code = document.getElementById('code').value.trim();
      const msg = document.getElementById('message1');
      const btn = document.getElementById('btnCode');

      if (!code || code.length < 4) {
        msg.textContent = 'Entre un code valide (6 caractères).';
        msg.className = 'message erreur';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Vérification…';

      try {
        const res = await fetch('/api/verifier-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();

        if (data.succes) {
          codeActuel = code.toUpperCase();
          document.getElementById('etape1').classList.remove('active');
          document.getElementById('etape2').classList.add('active');
          document.getElementById('dot1').classList.remove('active');
          document.getElementById('dot2').classList.add('active');
        } else {
          msg.textContent = data.erreur;
          msg.className = 'message erreur';
          btn.disabled = false;
          btn.textContent = 'Valider le code';
        }
      } catch (err) {
        msg.textContent = 'Erreur réseau. Réessaie.';
        msg.className = 'message erreur';
        btn.disabled = false;
        btn.textContent = 'Valider le code';
      }
    }

    document.getElementById('code').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') verifierCode();
    });

    document.getElementById('photo').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 10 * 1024 * 1024) {
        document.getElementById('message2').textContent = 'Photo trop lourde (max 10 Mo).';
        document.getElementById('message2').className = 'message erreur';
        return;
      }

      const apercu = document.getElementById('apercu');
      apercu.src = URL.createObjectURL(file);
      apercu.style.display = 'block';
      document.getElementById('btnEnvoi').disabled = false;
      document.getElementById('message2').textContent = '';
    });

    async function envoyerPhoto() {
      const file = document.getElementById('photo').files[0];
      const msg = document.getElementById('message2');
      const btn = document.getElementById('btnEnvoi');

      if (!file) {
        msg.textContent = 'Choisis une photo.';
        msg.className = 'message erreur';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Analyse en cours…';
      msg.textContent = 'Analyse OCR en cours, ça peut prendre 10 à 30 secondes…';
      msg.className = 'message info';

      const formData = new FormData();
      formData.append('photo', file);
      formData.append('code', codeActuel);

      try {
        const res = await fetch('/api/verifier-photo', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.succes) {
          msg.textContent = data.message;
          msg.className = 'message ' + (data.moderation ? 'info' : 'ok');
          btn.textContent = '✅ Envoyé';
        } else {
          msg.textContent = data.erreur || 'Erreur.';
          msg.className = 'message erreur';
          btn.disabled = false;
          btn.textContent = 'Envoyer la photo';
        }
      } catch (err) {
        msg.textContent = 'Erreur réseau. Réessaie.';
        msg.className = 'message erreur';
        btn.disabled = false;
        btn.textContent = 'Envoyer la photo';
      }
    }
  </script>
</body>
</html>
